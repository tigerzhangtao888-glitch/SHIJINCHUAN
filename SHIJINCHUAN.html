<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>魂斗罗 - CONTRA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #gameWrap {
    position: relative;
    width: 960px;
    height: 540px;
    box-shadow: 0 0 60px rgba(255, 60, 0, 0.35);
    border: 2px solid #c8321e;
    background: #000;
  }
  canvas { display: block; background: #1a0e2e; cursor: default; }

  #hud {
    position: absolute;
    top: 8px; left: 12px; right: 12px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 14px;
    text-shadow: 2px 2px 0 #000;
    color: #ffe;
    z-index: 3;
  }
  .hud-item { background: rgba(0,0,0,0.45); padding: 4px 10px; border-radius: 4px; }

  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(5,2,12,0.93);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  h1 {
    font-size: 64px;
    color: #ff3c00;
    text-shadow: 0 0 24px rgba(255,60,0,0.8), 3px 3px 0 #600;
    letter-spacing: 12px;
    margin-bottom: 6px;
  }
  .sub { color: #f8c471; letter-spacing: 6px; margin-bottom: 26px; font-size: 16px; }
  .btn {
    background: #c8321e;
    color: #fff;
    border: 2px solid #ff9a5a;
    padding: 12px 42px;
    font-size: 18px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
    margin: 8px;
    letter-spacing: 4px;
    transition: all 0.15s;
  }
  .btn:hover { background: #ff3c00; transform: scale(1.06); }
  .controls {
    color: #998;
    font-size: 13px;
    margin-top: 24px;
    line-height: 2;
  }
  .controls b { color: #f8c471; }
  #finalScore, #finalTime { color: #ffd700; }
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="hud">
    <div class="hud-item">P1 ❤️×<span id="livesVal">3</span></div>
    <div class="hud-item">武器 <span id="weaponVal">R</span></div>
    <div class="hud-item">SCORE <span id="scoreVal">000000</span></div>
    <div class="hud-item">⏱ <span id="timeVal">0</span>s</div>
  </div>

  <div id="menuScreen" class="overlay">
    <h1>魂斗罗</h1>
    <div class="sub">CONTRA — 经典横版射击</div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="controls">
      <b>A / D</b> 左右移动 &nbsp; <b>K / 空格</b> 跳跃 &nbsp; <b>J / Z</b> 射击 &nbsp; <b>W / S</b> 上/下瞄准<br>
      击落红色飞行舱获得武器升级：<b>S</b> 散弹 / <b>M</b> 机枪 / <b>B</b> 无敌屏障<br>
      一路向右杀到底，摧毁外星核心 BOSS！
    </div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1 style="font-size:44px; letter-spacing:6px;">GAME OVER</h1>
    <div class="sub" style="letter-spacing:2px;">
      得分: <span id="finalScore">0</span> &nbsp; 用时: <span id="finalTime">0</span>s
    </div>
    <button class="btn" id="retryBtn">再战一次</button>
  </div>

  <div id="winScreen" class="overlay hidden">
    <h1 style="font-size:44px; letter-spacing:6px; color:#ffd700; text-shadow:0 0 24px rgba(255,215,0,0.8);">任务完成！</h1>
    <div class="sub" style="letter-spacing:2px;">
      外星核心已被摧毁！<br>
      得分: <span id="winScore">0</span> &nbsp; 用时: <span id="winTime">0</span>s
    </div>
    <button class="btn" id="winRetryBtn">再战一次</button>
  </div>
</div>

<script>
'use strict';
// ================= 基础工具 =================
const W = 960, H = 540;
const GRAV = 0.55;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand = (a,b)=>a+Math.random()*(b-a);
const rectsOverlap = (a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

// ================= 输入 =================
const keys = {};
addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

// ================= 粒子 =================
const particles = [];
function explode(x,y,color='#ff8800',n=16,power=3){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), s=rand(1,power);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rand(18,40),max:40,size:rand(2,4),color:Math.random()<0.4?'#ffdd44':color});
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.vx*=0.97; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(camX){
  for(const p of particles){
    ctx.globalAlpha = p.life/p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-camX-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ================= 关卡数据 =================
// 平台: {x,y,w,h,type}  type: 'ground'|'plat'|'bridge'
const LEVEL_W = 4200;
function buildLevel(){
  const plats = [];
  // 地面段（含沟壑）
  const grounds = [
    [0, 480, 700, 60], [820, 480, 500, 60], [1440, 480, 420, 60],
    [1980, 480, 560, 60], [2660, 480, 480, 60], [3260, 480, 940, 60],
  ];
  for(const [x,y,w,h] of grounds) plats.push({x,y,w,h,type:'ground'});
  // 悬浮平台
  const ps = [
    [300,380,120,18],[520,300,120,18],[900,370,120,18],[1150,290,140,18],
    [1500,360,120,18],[1700,270,120,18],[2050,370,130,18],[2280,280,130,18],
    [2500,190,110,18],[2720,360,120,18],[2950,270,140,18],[3150,180,110,18],
    [3330,370,120,18],[3550,290,120,18],[3750,370,120,18],
  ];
  for(const [x,y,w,h] of ps) plats.push({x,y,w,h,type:'plat'});
  // 桥梁
  plats.push({x:700,y:480,w:120,h:14,type:'bridge'});
  plats.push({x:1320,y:480,w:120,h:14,type:'bridge'});
  plats.push({x:1860,y:480,w:120,h:14,type:'bridge'});
  plats.push({x:2540,y:480,w:120,h:14,type:'bridge'});
  plats.push({x:3140,y:480,w:120,h:14,type:'bridge'});
  return plats;
}

// 敌人布点
function buildEnemies(){
  const list = [];
  const runners = [350, 620, 950, 1200, 1560, 1780, 2100, 2360, 2760, 3060, 3380, 3620, 3830];
  for(const x of runners) list.push({kind:'runner', x, y:0});
  const turrets = [
    {x:560,y:452},{x:1180,y:452},{x:1730,y:242},{x:2320,y:452},{x:2980,y:242},{x:3580,y:452}
  ];
  for(const t of turrets) list.push({kind:'turret', x:t.x, y:t.y});
  const jumpers = [1050, 1650, 2200, 2880, 3480];
  for(const x of jumpers) list.push({kind:'jumper', x, y:0});
  // 飞行道具舱（打掉掉落武器）
  const pods = [480, 1100, 1620, 2150, 2820, 3350, 3720];
  const podTypes = ['S','M','B','S','M','S','B'];
  pods.forEach((x,i)=> list.push({kind:'pod', x, y:0, drop:podTypes[i]}));
  return list;
}

// ================= 玩家 =================
class Player {
  constructor(){
    this.w=22; this.h=40;
    this.x=60; this.y=100;
    this.vx=0; this.vy=0;
    this.onGround=false;
    this.face=1;            // 1右 -1左
    this.aimY=0;            // -1上 0平 1下
    this.weapon='R';        // R步枪 S散弹 M机枪
    this.fireCd=0;
    this.invuln=90;
    this.dead=false;
    this.deadTimer=0;
    this.lives=3;
    this.score=0;
    this.animT=0;
    this.dropThrough=0;
  }
  update(plats){
    if(this.dead){
      this.deadTimer++;
      this.vy+=GRAV; this.y+=this.vy;
      if(this.deadTimer>90){
        this.lives--;
        if(this.lives<0){ Game.over(); return; }
        this.respawn();
      }
      return;
    }
    const L = keys['a']||keys['arrowleft'];
    const R = keys['d']||keys['arrowright'];
    const U = keys['w']||keys['arrowup'];
    const D = keys['s']||keys['arrowdown'];
    const J = keys['k']||keys[' '];
    const F = keys['j']||keys['z'];

    this.aimY = U?-1 : D?1 : 0;

    const spd = 3.6;
    if(L){ this.vx=-spd; this.face=-1; }
    else if(R){ this.vx=spd; this.face=1; }
    else this.vx=0;

    // 下蹲穿越平台
    if(D && J && this.onGround){ this.dropThrough=12; }
    else if(J && this.onGround && !this._jHeld){
      this.vy=-12.5;
      this.onGround=false;
    }
    this._jHeld = J;
    if(this.dropThrough>0) this.dropThrough--;

    // 重力
    this.vy += GRAV;
    if(this.vy>14) this.vy=14;

    // 水平移动
    this.x += this.vx;
    this.x = clamp(this.x, Game.camX, Game.camX + W - this.w);

    // 垂直移动 + 平台碰撞（单向平台：只从上方落）
    const prevBottom = this.y + this.h;
    this.y += this.vy;
    this.onGround = false;
    for(const p of plats){
      if(this.dropThrough>0 && p.type!=='ground') continue;
      if(this.x+this.w > p.x && this.x < p.x+p.w){
        if(this.vy>=0 && prevBottom <= p.y+2 && this.y+this.h >= p.y){
          this.y = p.y - this.h;
          this.vy = 0;
          this.onGround = true;
        }
      }
    }

    // 掉出地图死亡
    if(this.y > H+80) this.die();

    // 射击
    if(this.fireCd>0) this.fireCd--;
    if(F && this.fireCd<=0) this.shoot();

    if(this.invuln>0) this.invuln--;
    if(this.vx!==0 && this.onGround) this.animT+=0.25; else this.animT=0;
  }
  respawn(){
    this.x = Game.camX + 60;
    this.y = 100;
    this.vy=0; this.vx=0;
    this.dead=false; this.deadTimer=0;
    this.invuln=150;
    this.weapon='R';
  }
  die(){
    if(this.dead||this.invuln>0) return;
    this.dead=true;
    this.deadTimer=0;
    this.vy=-8;
    explode(this.x+this.w/2, this.y+this.h/2, '#ff3333', 24, 4);
  }
  shoot(){
    const rates = {R:14, S:20, M:7};
    this.fireCd = rates[this.weapon];
    const cx=this.x+this.w/2, cy=this.y+14;
    let dx=this.face, dy=0;
    if(this.aimY===-1){ dx=this.face*0.35; dy=-1; }
    else if(this.aimY===1 && !this.onGround){ dx=this.face*0.35; dy=1; }
    const len=Math.hypot(dx,dy); dx/=len; dy/=len;
    const mk=(a)=> bullets.push({x:cx,y:cy,vx:Math.cos(a)*11,vy:Math.sin(a)*11,friendly:true,r:3,color:'#ffee55',dmg:1});
    const baseA=Math.atan2(dy,dx);
    if(this.weapon==='S'){
      for(const off of [-0.28,-0.14,0,0.14,0.28]) mk(baseA+off);
    } else {
      mk(baseA);
    }
    // 枪口火光
    particles.push({x:cx+dx*18,y:cy+dy*18,vx:dx*2,vy:dy*2,life:6,max:6,size:4,color:'#fff3a0'});
  }
  draw(camX){
    if(this.dead && this.deadTimer>10) return;
    const x=this.x-camX, y=this.y;
    ctx.save();
    if(this.invuln>0 && Math.floor(this.invuln/4)%2===0) ctx.globalAlpha=0.45;
    // 腿
    const run = Math.sin(this.animT)*5;
    ctx.strokeStyle='#2a7de1'; ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(x+11,y+24);
    ctx.lineTo(x+8+run,y+40);
    ctx.moveTo(x+11,y+24);
    ctx.lineTo(x+14-run,y+40);
    ctx.stroke();
    // 身体（红色背心 - 经典比尔）
    ctx.fillStyle='#e03a2a';
    ctx.fillRect(x+5,y+10,12,16);
    // 头
    ctx.fillStyle='#f0c090';
    ctx.fillRect(x+7,y+0,9,9);
    // 头带
    ctx.fillStyle='#c02020';
    ctx.fillRect(x+7,y+2,9,3);
    // 枪
    ctx.save();
    ctx.translate(x+11,y+16);
    let ang=0;
    if(this.aimY===-1) ang=-Math.PI/3*this.face;
    else if(this.aimY===1 && !this.onGround) ang=Math.PI/3*this.face;
    if(this.face<0) ang=Math.atan2(Math.sin(ang),-Math.cos(ang));
    ctx.rotate(ang);
    ctx.fillStyle='#666';
    ctx.fillRect(0,-2,18,4);
    ctx.restore();
    ctx.restore();
  }
}

// ================= 敌人 =================
const enemies = [];
const bullets = [];
const pickups = [];

function spawnEnemy(def){
  const plats = Game.plats;
  // 找脚下平台放置
  let groundY = 480;
  if(def.kind!=='turret' && def.kind!=='pod'){
    groundY = H+200;
    for(const p of plats){
      if(def.x>=p.x-10 && def.x<=p.x+p.w && p.y<groundY){ groundY=p.y; }
    }
    if(groundY>H) return; // 沟壑上方不生成
  }
  if(def.kind==='runner'){
    enemies.push({kind:'runner',x:def.x,y:groundY-36,w:22,h:36,hp:1,dir:Math.random()<0.5?-1:1,speed:rand(1.4,2.2),animT:0,dead:false,score:100});
  } else if(def.kind==='jumper'){
    enemies.push({kind:'jumper',x:def.x,y:groundY-36,w:22,h:36,hp:2,dir:-1,speed:1.6,vy:0,jumpCd:rand(40,90),animT:0,dead:false,score:200});
  } else if(def.kind==='turret'){
    enemies.push({kind:'turret',x:def.x,y:def.y,w:28,h:28,hp:3,fireCd:rand(50,110),dead:false,score:300});
  } else if(def.kind==='pod'){
    enemies.push({kind:'pod',x:def.x,y:80+Math.sin(def.x)*0,w:20,h:20,hp:1,vx:1.2,baseY:rand(70,140),t:0,drop:def.drop,dead:false,score:150});
  } else if(def.kind==='boss'){
    enemies.push({kind:'boss',x:def.x,y:def.y,w:90,h:110,hp:60,maxHp:60,fireCd:60,spawnCd:200,t:0,dead:false,score:5000});
  }
}

function updateEnemies(){
  const p = Game.player;
  for(const e of enemies){
    if(e.dead) continue;
    if(e.kind==='runner'){
      e.x += e.dir*e.speed;
      e.animT += 0.3;
      // 到达平台边缘转向
      let hasGround=false;
      for(const pl of Game.plats){
        if(e.x+e.w/2+e.dir*14>pl.x && e.x+e.w/2+e.dir*14<pl.x+pl.w && Math.abs(e.y+e.h-pl.y)<6){ hasGround=true; break; }
      }
      if(!hasGround) e.dir*=-1;
      // 触碰玩家
      if(!p.dead && p.invuln<=0 && rectsOverlap(e,p)) p.die();
    }
    else if(e.kind==='jumper'){
      e.jumpCd--;
      if(e.jumpCd<=0 && e.vy===0){
        e.vy=-11;
        e.dir = p.x>e.x?1:-1;
        e.jumpCd=rand(70,130);
      }
      e.x += e.dir*e.speed*(e.vy!==0?1.6:0.4);
      e.vy+=GRAV;
      const prevB=e.y+e.h;
      e.y+=e.vy;
      if(e.vy>=0){
        for(const pl of Game.plats){
          if(e.x+e.w>pl.x && e.x<pl.x+pl.w && prevB<=pl.y+2 && e.y+e.h>=pl.y){
            e.y=pl.y-e.h; e.vy=0;
          }
        }
      }
      if(e.y>H+100){ e.dead=true; }
      e.animT+=0.3;
      if(!p.dead && p.invuln<=0 && rectsOverlap(e,p)) p.die();
    }
    else if(e.kind==='turret'){
      e.fireCd--;
      if(e.fireCd<=0 && Math.abs(p.x-e.x)<520 && !p.dead){
        e.fireCd=rand(90,140);
        const a=Math.atan2(p.y+16-(e.y+10), p.x+11-(e.x+14));
        bullets.push({x:e.x+14,y:e.y+10,vx:Math.cos(a)*4.5,vy:Math.sin(a)*4.5,friendly:false,r:4,color:'#ff55aa',dmg:1});
      }
    }
    else if(e.kind==='pod'){
      e.t+=0.05;
      e.x-=e.vx;
      e.y=e.baseY+Math.sin(e.t)*20;
      if(e.x<Game.camX-40) e.dead=true;
    }
    else if(e.kind==='boss'){
      e.t+=0.03;
      e.fireCd--;
      e.spawnCd--;
      // 三向散射
      if(e.fireCd<=0 && !p.dead){
        e.fireCd=75;
        const a=Math.atan2(p.y+16-(e.y+50), p.x+11-(e.x+10));
        for(const off of [-0.3,0,0.3]){
          bullets.push({x:e.x+10,y:e.y+50,vx:Math.cos(a+off)*5,vy:Math.sin(a+off)*5,friendly:false,r:5,color:'#ff3377',dmg:1});
        }
      }
      // 召唤小兵
      if(e.spawnCd<=0){
        e.spawnCd=260;
        enemies.push({kind:'runner',x:e.x-30,y:e.y+e.h-36,w:22,h:36,hp:1,dir:-1,speed:2,animT:0,dead:false,score:100});
      }
    }
  }
  // 清理
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){
      if(e.kind==='pod' && e.dropped){
        pickups.push({x:e.x,y:e.y,w:18,h:18,vx:2,vy:-4,type:e.drop,t:0});
      }
      enemies.splice(i,1);
    }
  }
}

function killEnemy(e){
  e.dead=true;
  Game.player.score += e.score;
  const cx=e.x+e.w/2, cy=e.y+e.h/2;
  if(e.kind==='boss'){
    for(let i=0;i<4;i++){
      setTimeout(()=>explode(cx+rand(-40,40),cy+rand(-50,50),'#ff2266',26,5), i*160);
    }
    setTimeout(()=>Game.win(), 1400);
  } else {
    explode(cx,cy, e.kind==='pod'?'#ffdd33':'#ff6644', e.kind==='turret'?18:12, 3);
    if(e.kind==='pod') e.dropped=true;
  }
}

// ================= 子弹 =================
function updateBullets(){
  const p=Game.player;
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy;
    let hit=false;
    // 出界
    if(b.x<Game.camX-40||b.x>Game.camX+W+40||b.y<-40||b.y>H+40) hit=true;
    // 撞平台
    if(!hit){
      for(const pl of Game.plats){
        if(pl.type==='ground' && b.x>pl.x&&b.x<pl.x+pl.w&&b.y>pl.y&&b.y<pl.y+pl.h){ hit=true; break; }
      }
    }
    if(b.friendly){
      if(!hit){
        for(const e of enemies){
          if(e.dead) continue;
          if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
            e.hp-=b.dmg; hit=true;
            particles.push({x:b.x,y:b.y,vx:-b.vx*0.2,vy:-1,life:8,max:8,size:3,color:'#ffaa55'});
            if(e.hp<=0) killEnemy(e);
            break;
          }
        }
      }
    } else {
      if(!p.dead && p.invuln<=0 && b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        p.die(); hit=true;
      }
    }
    if(hit) bullets.splice(i,1);
  }
}
function drawBullets(camX){
  for(const b of bullets){
    ctx.fillStyle=b.color;
    ctx.shadowBlur=8; ctx.shadowColor=b.color;
    ctx.beginPath();
    ctx.arc(b.x-camX,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }
}

// ================= 道具 =================
function updatePickups(){
  const p=Game.player;
  for(let i=pickups.length-1;i>=0;i--){
    const k=pickups[i];
    k.t++;
    k.vy+=0.3;
    k.x+=k.vx; k.y+=k.vy;
    if(k.vx>0&&k.t>40) k.vx=0;
    // 落平台
    for(const pl of Game.plats){
      if(k.x+k.w>pl.x&&k.x<pl.x+pl.w&&k.vy>=0&&k.y+k.h>=pl.y&&k.y+k.h<pl.y+20){
        k.y=pl.y-k.h; k.vy=0;
      }
    }
    if(k.y>H+60){ pickups.splice(i,1); continue; }
    if(!p.dead && rectsOverlap(k,p)){
      p.score+=500;
      if(k.type==='S') p.weapon='S';
      else if(k.type==='M') p.weapon='M';
      else if(k.type==='B') p.invuln=480;
      explode(k.x+9,k.y+9,'#66ffcc',10,2);
      pickups.splice(i,1);
    }
  }
}
function drawPickups(camX){
  for(const k of pickups){
    const x=k.x-camX, blink=Math.floor(k.t/8)%2===0;
    ctx.fillStyle = k.type==='S'?'#ff4444':k.type==='M'?'#44ddff':'#ffee44';
    ctx.fillRect(x,k.y,18,18);
    ctx.strokeStyle='#fff';
    ctx.strokeRect(x,k.y,18,18);
    ctx.fillStyle=blink?'#fff':'#000';
    ctx.font='bold 12px Courier New';
    ctx.textAlign='center';
    ctx.fillText(k.type, x+9, k.y+13);
  }
}

// ================= 敌人绘制 =================
function drawEnemies(camX){
  for(const e of enemies){
    const x=e.x-camX;
    if(x<-120||x>W+120) continue;
    if(e.kind==='runner'||e.kind==='jumper'){
      const run=Math.sin(e.animT)*4;
      ctx.strokeStyle='#3aa845'; ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(x+11,e.y+22); ctx.lineTo(x+8+run,e.y+36);
      ctx.moveTo(x+11,e.y+22); ctx.lineTo(x+14-run,e.y+36);
      ctx.stroke();
      ctx.fillStyle='#3aa845';
      ctx.fillRect(x+5,e.y+8,12,15);
      ctx.fillStyle='#d0a070';
      ctx.fillRect(x+7,e.y+0,9,8);
      ctx.fillStyle='#2a6a32';
      ctx.fillRect(x+7,e.y+0,9,3);
      // 枪
      ctx.fillStyle='#555';
      const gd = e.dir>0?1:-1;
      ctx.fillRect(gd>0?x+14:x-6, e.y+12, 14, 3);
    }
    else if(e.kind==='turret'){
      ctx.fillStyle='#888';
      ctx.fillRect(x,e.y+10,28,18);
      ctx.fillStyle='#aaa';
      ctx.beginPath();
      ctx.arc(x+14,e.y+10,10,Math.PI,0);
      ctx.fill();
      // 炮管指向玩家
      const p=Game.player;
      const a=Math.atan2(p.y+16-(e.y+10), p.x+11-(e.x+14));
      ctx.save();
      ctx.translate(x+14,e.y+10);
      ctx.rotate(a);
      ctx.fillStyle='#666';
      ctx.fillRect(0,-2,16,4);
      ctx.restore();
      ctx.fillStyle=e.fireCd<20?'#ff5555':'#333';
      ctx.fillRect(x+12,e.y+2,4,4);
    }
    else if(e.kind==='pod'){
      ctx.fillStyle='#c8321e';
      ctx.beginPath();
      ctx.arc(x+10,e.y+10,10,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#ffdd55';
      ctx.beginPath();
      ctx.arc(x+10,e.y+10,4,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#ff8866';
      ctx.strokeRect(x+2,e.y+2,16,16);
    }
    else if(e.kind==='boss'){
      // 外星核心：大肉壁 + 心脏
      ctx.fillStyle='#5a2038';
      ctx.fillRect(x-10,e.y-20,e.w+20,e.h+40);
      ctx.fillStyle='#7a2a48';
      ctx.fillRect(x,e.y,e.w,e.h);
      // 触手
      ctx.strokeStyle='#8a3a58';
      ctx.lineWidth=5;
      for(let i=0;i<3;i++){
        const sw=Math.sin(e.t*2+i)*14;
        ctx.beginPath();
        ctx.moveTo(x+10,e.y+20+i*35);
        ctx.quadraticCurveTo(x-25,e.y+20+i*35+sw, x-45,e.y+30+i*35);
        ctx.stroke();
      }
      // 心脏（弱点）
      const beat=1+Math.sin(e.t*6)*0.15;
      ctx.fillStyle=e.fireCd<25?'#ff4477':'#cc2255';
      ctx.beginPath();
      ctx.arc(x+30,e.y+55,16*beat,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#ff88aa';
      ctx.lineWidth=2;
      ctx.stroke();
      // 血条
      ctx.fillStyle='#300';
      ctx.fillRect(x-10,e.y-32,e.w+20,7);
      ctx.fillStyle='#ff2255';
      ctx.fillRect(x-10,e.y-32,(e.w+20)*(e.hp/e.maxHp),7);
      ctx.fillStyle='#fff';
      ctx.font='10px Courier New';
      ctx.textAlign='center';
      ctx.fillText('外星核心', x+e.w/2, e.y-38);
    }
  }
}

// ================= 背景 =================
function drawBackground(camX){
  // 天空渐变
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#160a2e');
  g.addColorStop(0.6,'#3a1638');
  g.addColorStop(1,'#5a2038');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  // 星星
  ctx.fillStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<50;i++){
    const sx=(i*173)%W, sy=(i*97)%200;
    ctx.fillRect(sx,sy,2,2);
  }
  // 远山（视差0.3）
  ctx.fillStyle='#241040';
  for(let i=-1;i<8;i++){
    const bx=i*260 - (camX*0.3)%260;
    ctx.beginPath();
    ctx.moveTo(bx,480);
    ctx.lineTo(bx+130,300);
    ctx.lineTo(bx+260,480);
    ctx.fill();
  }
  // 近山（视差0.6）
  ctx.fillStyle='#341848';
  for(let i=-1;i<10;i++){
    const bx=i*180 - (camX*0.6)%180;
    ctx.beginPath();
    ctx.moveTo(bx,480);
    ctx.lineTo(bx+90,380);
    ctx.lineTo(bx+180,480);
    ctx.fill();
  }
}

function drawPlats(camX){
  for(const p of Game.plats){
    const x=p.x-camX;
    if(x+p.w<0||x>W) continue;
    if(p.type==='ground'){
      ctx.fillStyle='#4a3520';
      ctx.fillRect(x,p.y,p.w,p.h);
      ctx.fillStyle='#3aa845';
      ctx.fillRect(x,p.y,p.w,6);
      ctx.fillStyle='#2a7a35';
      for(let gx=0;gx<p.w;gx+=16) ctx.fillRect(x+gx+4,p.y+2,3,3);
    } else if(p.type==='plat'){
      ctx.fillStyle='#6a5a3a';
      ctx.fillRect(x,p.y,p.w,p.h);
      ctx.fillStyle='#8a7a4a';
      ctx.fillRect(x,p.y,p.w,4);
      ctx.strokeStyle='#3a2f1a';
      ctx.strokeRect(x,p.y,p.w,p.h);
    } else { // bridge
      ctx.fillStyle='#8a6a3a';
      ctx.fillRect(x,p.y,p.w,p.h);
      ctx.strokeStyle='#5a4a2a';
      for(let bx=0;bx<p.w;bx+=12){
        ctx.beginPath();
        ctx.moveTo(x+bx,p.y);
        ctx.lineTo(x+bx,p.y+p.h);
        ctx.stroke();
      }
    }
  }
}

// ================= 游戏管理 =================
const Game = {
  state:'menu',
  camX:0,
  player:null,
  plats:[],
  bossSpawned:false,
  time:0,
  start(){
    this.state='playing';
    this.player=new Player();
    this.plats=buildLevel();
    enemies.length=0; bullets.length=0; particles.length=0; pickups.length=0;
    for(const def of buildEnemies()) spawnEnemy(def);
    this.camX=0;
    this.bossSpawned=false;
    this.time=0;
    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    document.getElementById('winScreen').classList.add('hidden');
  },
  over(){
    this.state='over';
    document.getElementById('finalScore').textContent=this.player.score;
    document.getElementById('finalTime').textContent=Math.floor(this.time/60);
    document.getElementById('overScreen').classList.remove('hidden');
  },
  win(){
    if(this.state!=='playing') return;
    this.state='win';
    document.getElementById('winScore').textContent=this.player.score;
    document.getElementById('winTime').textContent=Math.floor(this.time/60);
    document.getElementById('winScreen').classList.remove('hidden');
  },
  update(){
    if(this.state!=='playing') return;
    this.time++;
    this.player.update(this.plats);
    if(this.state!=='playing') return;
    // 相机跟随
    const target=this.player.x - W*0.38;
    this.camX = Math.max(this.camX, clamp(target, 0, LEVEL_W-W));
    // Boss触发
    if(!this.bossSpawned && this.camX > LEVEL_W - W - 60){
      this.bossSpawned=true;
      spawnEnemy({kind:'boss', x:LEVEL_W-160, y:370});
    }
    updateEnemies();
    updateBullets();
    updatePickups();
    updateParticles();
    this.hud();
  },
  hud(){
    document.getElementById('livesVal').textContent=Math.max(0,this.player.lives);
    document.getElementById('weaponVal').textContent=this.player.weapon;
    document.getElementById('scoreVal').textContent=String(this.player.score).padStart(6,'0');
    document.getElementById('timeVal').textContent=Math.floor(this.time/60);
  },
  draw(){
    drawBackground(this.camX);
    drawPlats(this.camX);
    drawPickups(this.camX);
    drawEnemies(this.camX);
    if(this.player) this.player.draw(this.camX);
    drawBullets(this.camX);
    drawParticles(this.camX);
  },
  loop(){
    this.update();
    this.draw();
    requestAnimationFrame(()=>this.loop());
  }
};

document.getElementById('startBtn').onclick=()=>Game.start();
document.getElementById('retryBtn').onclick=()=>Game.start();
document.getElementById('winRetryBtn').onclick=()=>Game.start();

Game.loop();
</script>
